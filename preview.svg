<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00c8ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Name -->
  <text
    x="100"
    y="260"
    font-size="72"
    font-weight="800"
    fill="url(#text)"
    font-family="Inter, Arial, sans-serif"
  >
    Aditya Kumar Bichhave
  </text>

  <!-- Subtitle (FIXED &amp;) -->
  <text
    x="100"
    y="330"
    font-size="36"
    fill="#cbd5f5"
    font-family="Inter, Arial, sans-serif"
  >
    Full-Stack Developer &amp; Cybersecurity Enthusiast
  </text>

  <!-- Website -->
  <text
    x="100"
    y="390"
    font-size="26"
    fill="#94a3b8"
    font-family="Inter, Arial, sans-serif"
  >
    adityabichhave.github.io
  </text>

  <!-- Initials badge -->
  <rect
    x="950"
    y="200"
    width="180"
    height="180"
    rx="32"
    fill="#0b132b"
    stroke="#00f0ff"
    stroke-width="4"
  />

  <text
    x="1040"
    y="320"
    text-anchor="middle"
    font-size="96"
    font-weight="800"
    fill="#00f0ff"
    font-family="Inter, Arial, sans-serif"
  >
    AB
  </text>
</svg>
