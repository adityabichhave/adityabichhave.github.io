<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow -->
  <circle cx="200" cy="150" r="180" fill="#00eefe" opacity="0.12"/>
  <circle cx="1000" cy="500" r="220" fill="#00eefe" opacity="0.1"/>

  <!-- Name -->
  <text x="80" y="270"
        font-size="64"
        font-weight="800"
        fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif">
    Aditya Kumar Bichhave
  </text>

  <!-- Subtitle -->
  <text x="82" y="330"
        font-size="36"
        fill="#00eefe"
        font-family="Arial, Helvetica, sans-serif">
    Aspiring Full-Stack Developer & Cybersecurity Enthusiast
  </text>

  <!-- Skills line -->
  <text x="82" y="390"
        font-size="24"
        fill="#b8c1ec"
        font-family="Arial, Helvetica, sans-serif">
    React · Node.js · MongoDB · Cyber Security · DSA
  </text>

  <!-- Footer -->
  <text x="82" y="470"
        font-size="22"
        fill="#8892b0"
        font-family="Arial, Helvetica, sans-serif">
    Portfolio · Projects · Certifications · Contact
  </text>
</svg>
